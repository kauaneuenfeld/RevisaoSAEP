<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="utf-8"><title>Editar aluno</title></head>
<body>
<div id="topo"></div>
<h2>Editar aluno</h2>
<p>Nome: <input id="nome"></p>
<p>CPF (11 números): <input id="cpf" maxlength="11"></p>
<p>E-mail: <input id="email"></p>
<p>Telefone: <input id="telefone"></p>
<button onclick="salvar()">Salvar</button>
<a href="listar.html">Voltar</a>
<p id="erro" style="color:red"></p>
<script src="script.js"></script>
<script>
cabecalho();
const id = new URLSearchParams(location.search).get('id');
async function carregar() {
  const alunos = await api('/api/alunos');
  const a = alunos.find(x => String(x.id) === id);
  if (!a) { document.getElementById('erro').textContent = 'Aluno não encontrado'; return; }
  for (const c of ['nome', 'cpf', 'email', 'telefone']) document.getElementById(c).value = a[c] || '';
}
async function salvar() {
  const d = {};
  for (const c of ['nome', 'cpf', 'email', 'telefone']) d[c] = document.getElementById(c).value.trim();
  const erro = document.getElementById('erro');
  if (!d.nome || d.cpf.length !== 11) { erro.textContent = 'Informe o nome e um CPF com 11 números'; return; }
  try {
    await api('/api/alunos/' + id, 'PUT', d);
    location.href = 'listar.html';
  } catch (e) { erro.textContent = e.message; }
}
carregar();
</script>
</body>
</html>
